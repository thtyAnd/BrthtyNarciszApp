<script>
/* ============================================================================

   name        : a megjelenő név (nagybetűsítést a CSS végzi)
   disciplines : a szakterületek egy sorban, " · " választóval
   eyebrow     : opcionális kis felirat a név fölött ("" = kikapcsolva)
   meta        : opcionális diszkrét felirat jobbra alul, pl. saját domain ("" = kikapcsolva)
   ========================================================================== */
const CONFIG = {
  hu: {
    name:        'Berthóty András',
    disciplines: 'Grafika · Fotó · Webdesign · Kód · Formatervezés',

    meta:        ''
  },
  en: {
    name:        'András Berthóty',
    disciplines: 'Graphics · Photography · Web · Code · Product design',
    eyebrow:     '',
    meta:        ''
  }
};
</script>

<style>

/* ---------- Design tokenek ------------------------------------------------ */
:root{
  --accent:#C1552F;
  --grid-unit:44px;      /* alap modul */
  --grid-major:176px;    /* 4 × modul  */
}
[data-theme="dark"]{
  --bg:#0E0F11;
  --fg:#F4F5F6;
  --fg-2:#9AA1AA;
  --fg-3:#7A8188;
  --line:rgba(255,255,255,.26);
  --grid-minor:rgba(255,255,255,.026);
  --grid-strong:rgba(255,255,255,.070);
  --glow:rgba(255,255,255,.05);
  --mark:rgba(255,255,255,.26);
  --mark-soft:rgba(255,255,255,.14);
  --name-weight:200;
}
[data-theme="light"]{
  --bg:#F7F6F3;
  --fg:#14161A;
  --fg-2:#5C6167;
  --fg-3:#686E76;
  --line:rgba(0,0,0,.24);
  --grid-minor:rgba(0,0,0,.030);
  --grid-strong:rgba(0,0,0,.075);
  --glow:rgba(255,255,255,.60);
  --mark:rgba(0,0,0,.30);
  --mark-soft:rgba(0,0,0,.16);
  --name-weight:250;   /* világos alapon egy hajszállal erősebb, hogy ne törjön meg */
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{width:1584px;height:396px;overflow:hidden}

.cover{
  position:relative;width:1584px;height:396px;
  background:var(--bg);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* halk „papír” raszter az egész felületen — csak textúra, nem grafika */
.raster{
  position:absolute;inset:0;
  background-image:
    linear-gradient(to right, var(--grid-minor) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-minor) 1px, transparent 1px);
  background-size:var(--grid-unit) var(--grid-unit);
  -webkit-mask-image:radial-gradient(105% 130% at 50% 42%, #000 0%, #000 34%, transparent 88%);
          mask-image:radial-gradient(105% 130% at 50% 42%, #000 0%, #000 34%, transparent 88%);
}
/* jobb oldali „rajzfelület”: erősebb modulháló a geometriai jel körül */
.plate{
  position:absolute;top:0;bottom:0;left:1148px;right:0;
  background-image:
    linear-gradient(to right, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-strong) 1px, transparent 1px);
  background-size:var(--grid-major) var(--grid-major);
  background-position:right top;
  -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 46%, #000 100%);
          mask-image:linear-gradient(to right, transparent 0%, #000 46%, #000 100%);
}
.glow{
  position:absolute;inset:0;
  background:radial-gradient(52% 110% at 74% 26%, var(--glow) 0%, transparent 62%);
}

/* ---------- Tartalom ------------------------------------------------------ */
.content{position:absolute;left:520px;top:50%;transform:translateY(-50%)}

/* méretezési zárójel — a névblokk magasságát jelöli, mint egy műszaki rajzon */
.bracket{
  position:absolute;left:-68px;top:4px;bottom:4px;width:10px;
  border-left:1px solid var(--line);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.eyebrow{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-weight:500;font-size:15px;line-height:1;
  letter-spacing:.30em;text-transform:uppercase;
  color:var(--fg-3);
  margin-bottom:26px;
}
.eyebrow:empty{display:none}

.name{
  font-weight:var(--name-weight);font-size:64px;line-height:1.04;
  letter-spacing:.055em;text-transform:uppercase;
  color:var(--fg);
  white-space:nowrap;
}
.rule{
  width:56px;height:2px;background:var(--accent);
  margin:26px 0 24px;
}
.disciplines{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-weight:400;font-size:19px;line-height:1.2;
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--fg-2);
  white-space:nowrap;
}

.meta{
  position:absolute;right:96px;bottom:52px;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-weight:400;font-size:14px;line-height:1;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--fg-3);
}
.meta:empty{display:none}

/* ---------- Geometriai jel (vetületi rajz utalás) ------------------------- */
.mark{position:absolute;right:104px;top:50%;transform:translateY(-50%)}

/* ---------- Biztonságos zóna előnézet (?safezone=1) ---------------------- */
.safezone{position:absolute;inset:0;display:none}
[data-safezone="1"] .safezone{display:block}
.sz-avatar{
  position:absolute;left:38px;bottom:-112px;width:224px;height:224px;
  border-radius:50%;
  border:2px dashed rgba(193,85,47,.85);
  background:rgba(193,85,47,.14);
}
.sz-box{
  position:absolute;left:460px;top:56px;right:64px;bottom:56px;
  border:2px dashed rgba(74,158,226,.85);
}
.sz-label{
  position:absolute;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 7px;border-radius:2px;color:#fff;
}
.sz-label-a{left:38px;bottom:120px;background:rgba(193,85,47,.92)}
.sz-label-b{left:460px;top:26px;background:rgba(74,158,226,.92)}
</style>
</head>
<body>

<div class="cover">
  <div class="raster"></div>
  <div class="plate"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="bracket" aria-hidden="true"></div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="name" id="name"></h1>
    <div class="rule"></div>
    <div class="disciplines" id="disciplines"></div>
  </div>

  <div class="meta" id="meta"></div>

  <svg class="mark" width="140" height="140" viewBox="0 0 140 140" fill="none" aria-hidden="true">
    <!-- alaphálós négyzet (felülnézet) -->
    <rect x="14.5" y="14.5" width="111" height="111" stroke="var(--mark)" stroke-width="1"/>
    <!-- beírt kör (metszet) -->
    <circle cx="70" cy="70" r="43.5" stroke="var(--mark)" stroke-width="1"/>
    <!-- tengelykereszt -->
    <path d="M70 52.5V87.5M52.5 70H87.5" stroke="var(--mark-soft)" stroke-width="1"/>
    <!-- méretvonal-utalás -->
    <path d="M14.5 132.5H125.5" stroke="var(--mark-soft)" stroke-width="1"/>
    <path d="M14.5 128v9M125.5 128v9" stroke="var(--mark-soft)" stroke-width="1"/>
    <!-- akcentus: bázispont a bal felső sarokban -->
    <rect x="10.5" y="10.5" width="8" height="8" fill="var(--accent)"/>
  </svg>

  <div class="safezone">
    <div class="sz-avatar"></div>
    <div class="sz-label sz-label-a">profilkép</div>
    <div class="sz-box"></div>
    <div class="sz-label sz-label-b">biztonságos zóna</div>
  </div>
</div>

<script>
const p     = new URLSearchParams(location.search);
const theme = p.get('theme') === 'light' ? 'light' : 'dark';
const lang  = p.get('lang')  === 'en'    ? 'en'    : 'hu';
const copy  = CONFIG[lang];

document.documentElement.dataset.theme    = theme;
document.documentElement.dataset.safezone = p.get('safezone') === '1' ? '1' : '0';
document.documentElement.lang             = lang;

document.getElementById('eyebrow').textContent     = copy.eyebrow;
document.getElementById('name').textContent        = copy.name;
document.getElementById('disciplines').textContent = copy.disciplines;
document.getElementById('meta').textContent        = copy.meta;

/* a renderelő erre a jelzésre vár, hogy a betűk biztosan betöltöttek */
document.fonts.ready.then(() => document.documentElement.setAttribute('data-ready', '1'));
</script>
</body>
